name: Style CI
# Gate: format (prettier --check) and build, verified on a clean, credential-free clone
# (2026-10-08).
# Every dependency, hds-style (healthdatasafe/style-package) included, is public, so
# `npm ci` needs no token.
# The `copy` script creates dist/ itself (locally dist/ is the gh-pages worktree; a
# fresh checkout has none). Deploy (`npm run deploy`) never runs from CI.
# Left out: nothing. `npm run format` joined once the repo was formatted (2026-10-08).

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Build
        run: npm run build
